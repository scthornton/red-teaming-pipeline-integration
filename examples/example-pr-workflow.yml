name: Prisma AIRS Red Teaming after deployment

# Copy to .github/workflows/ and call from a trusted deployment workflow.
# The deployment job must verify the revision actually served by this target.
# Use isolated PR targets, or serialize deployment and scanning together.
on:
  workflow_call:
    inputs:
      target_uuid:
        description: 'AIRS target serving the deployed revision'
        required: true
        type: string
      expected_sha:
        description: 'Full commit SHA being reviewed'
        required: true
        type: string
      deployed_sha:
        description: 'Full commit SHA verified on the running target'
        required: true
        type: string
    secrets:
      PRISMA_AIRS_CLIENT_SECRET:
        required: true

permissions:
  contents: read

concurrency:
  group: red-team-target-${{ inputs.target_uuid }}
  cancel-in-progress: false

jobs:
  red_teaming_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Run the trusted scanner, not Python code from the PR under review.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan deployed revision
        id: scan
        env:
          PRISMA_AIRS_CLIENT_ID: ${{ vars.PRISMA_AIRS_CLIENT_ID }}
          PRISMA_AIRS_CLIENT_SECRET: ${{ secrets.PRISMA_AIRS_CLIENT_SECRET }}
          PRISMA_AIRS_TSG_ID: ${{ vars.PRISMA_AIRS_TSG_ID }}
          PRISMA_AIRS_TOKEN_ENDPOINT: ${{ vars.PRISMA_AIRS_TOKEN_ENDPOINT || 'https://auth.apps.paloaltonetworks.com/oauth2/access_token' }}
          PRISMA_AIRS_RED_TEAM_DATA_ENDPOINT: ${{ vars.PRISMA_AIRS_RED_TEAM_DATA_ENDPOINT || 'https://api.sase.paloaltonetworks.com/ai-red-teaming/data-plane' }}
          PRISMA_AIRS_RED_TEAM_MGMT_ENDPOINT: ${{ vars.PRISMA_AIRS_RED_TEAM_MGMT_ENDPOINT || 'https://api.sase.paloaltonetworks.com/ai-red-teaming/mgmt-plane' }}
          TARGET_UUID: ${{ inputs.target_uuid }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          python redteam_scan.py \
            --target-uuid "$TARGET_UUID" \
            --expected-sha "$EXPECTED_SHA" \
            --deployed-sha "$DEPLOYED_SHA" \
            --scan-type STATIC \
            --max-asr-percent 2.0 \
            --fail-on-categories PROMPT_INJECTION,JAILBREAK \
            --max-wait-minutes 45
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: red-team-scan-report-${{ github.run_id }}
          path: |
            red_team_report.json
            red_team_result.json
          retention-days: 14
      - name: Summarize scan
        if: always()
        run: python ci_report.py summary
