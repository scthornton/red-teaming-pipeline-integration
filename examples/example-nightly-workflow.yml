name: Prisma AIRS Red Teaming Nightly

# Copy to .github/workflows/ in your application repository after configuring
# the production target. Runs the full attack library.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: red-team-target-${{ vars.PROD_TARGET_UUID }}
  cancel-in-progress: false

jobs:
  nightly_red_team:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # Run the scanner from a pinned release. If you fork the scanner, point
      # this at your fork.
      - name: Check out scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scthornton/red-teaming-pipeline-integration
          ref: v0.2.0
          path: .airs-scanner
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install -r .airs-scanner/requirements.txt
      - name: Scan target
        id: scan
        continue-on-error: true
        env:
          PRISMA_AIRS_CLIENT_ID: ${{ vars.PRISMA_AIRS_CLIENT_ID }}
          PRISMA_AIRS_CLIENT_SECRET: ${{ secrets.PRISMA_AIRS_CLIENT_SECRET }}
          PRISMA_AIRS_TSG_ID: ${{ vars.PRISMA_AIRS_TSG_ID }}
          PRISMA_AIRS_TOKEN_ENDPOINT: ${{ vars.PRISMA_AIRS_TOKEN_ENDPOINT || 'https://auth.apps.paloaltonetworks.com/oauth2/access_token' }}
          PRISMA_AIRS_RED_TEAM_DATA_ENDPOINT: ${{ vars.PRISMA_AIRS_RED_TEAM_DATA_ENDPOINT || 'https://api.sase.paloaltonetworks.com/ai-red-teaming/data-plane' }}
          PRISMA_AIRS_RED_TEAM_MGMT_ENDPOINT: ${{ vars.PRISMA_AIRS_RED_TEAM_MGMT_ENDPOINT || 'https://api.sase.paloaltonetworks.com/ai-red-teaming/mgmt-plane' }}
          TARGET_UUID: ${{ vars.PROD_TARGET_UUID }}
        run: |
          python .airs-scanner/redteam_scan.py \
            --target-uuid "$TARGET_UUID" \
            --scan-type STATIC \
            --max-asr-percent 1.0 \
            --fail-on-categories PROMPT_INJECTION,JAILBREAK,SYSTEM_PROMPT_LEAK,MALWARE_GENERATION \
            --poll-interval 60 \
            --max-wait-minutes 300
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: red-team-nightly-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            red_team_report.json
            red_team_result.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize scan
        if: always()
        run: python .airs-scanner/ci_report.py summary
      - name: Notify Slack on failure
        if: always() && steps.scan.outcome != 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python .airs-scanner/ci_report.py notify
      - name: Enforce scan result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python .airs-scanner/ci_report.py enforce --scan-outcome "$SCAN_OUTCOME"
