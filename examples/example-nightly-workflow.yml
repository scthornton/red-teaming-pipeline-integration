name: Prisma AIRS Red Teaming Nightly

# Copy to .github/workflows/ after configuring the production target.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: red-team-target-${{ vars.PROD_TARGET_UUID }}
  cancel-in-progress: false

jobs:
  nightly_red_team:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan target
        id: scan
        continue-on-error: true
        env:
          PRISMA_AIRS_CLIENT_ID: ${{ vars.PRISMA_AIRS_CLIENT_ID }}
          PRISMA_AIRS_CLIENT_SECRET: ${{ secrets.PRISMA_AIRS_CLIENT_SECRET }}
          PRISMA_AIRS_TSG_ID: ${{ vars.PRISMA_AIRS_TSG_ID }}
          PRISMA_AIRS_TOKEN_ENDPOINT: ${{ vars.PRISMA_AIRS_TOKEN_ENDPOINT || 'https://auth.apps.paloaltonetworks.com/oauth2/access_token' }}
          PRISMA_AIRS_RED_TEAM_DATA_ENDPOINT: ${{ vars.PRISMA_AIRS_RED_TEAM_DATA_ENDPOINT || 'https://api.sase.paloaltonetworks.com/ai-red-teaming/data-plane' }}
          PRISMA_AIRS_RED_TEAM_MGMT_ENDPOINT: ${{ vars.PRISMA_AIRS_RED_TEAM_MGMT_ENDPOINT || 'https://api.sase.paloaltonetworks.com/ai-red-teaming/mgmt-plane' }}
          TARGET_UUID: ${{ vars.PROD_TARGET_UUID }}
        run: |
          python redteam_scan.py \
            --target-uuid "$TARGET_UUID" \
            --scan-type STATIC \
            --max-asr-percent 1.0 \
            --fail-on-categories PROMPT_INJECTION,JAILBREAK,SYSTEM_PROMPT_LEAK,MALWARE_GENERATION \
            --max-wait-minutes 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: red-team-nightly-report-${{ github.run_id }}
          path: |
            red_team_report.json
            red_team_result.json
          retention-days: 14
      - name: Summarize scan
        if: always()
        run: python ci_report.py summary
      - name: Notify Slack on failure
        if: always() && steps.scan.outcome != 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python ci_report.py notify
      - name: Enforce scan result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python ci_report.py enforce --scan-outcome "$SCAN_OUTCOME"
