version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR per update run. Dependabot does not scan examples/; a test keeps
    # their pins in sync with .github/workflows/.
    groups:
      actions:
        patterns:
          - '*'
