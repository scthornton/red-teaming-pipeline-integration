name: Prisma AIRS Red Teaming Scan

on:
  workflow_dispatch:
    inputs:
      target_uuid:
        description: 'Red Teaming target UUID (must already exist in SCM)'
        required: true
      scan_type:
        description: 'Scan flavor (STATIC = attack library)'
        required: false
        default: 'STATIC'
        type: choice
        options:
          - STATIC
          - DYNAMIC
      categories:
        description: 'STATIC only. Comma-separated category groups or subcategory ids to scan (e.g. SECURITY or PROMPT_INJECTION). Empty = full attack library.'
        required: false
        default: ''
      max_asr_percent:
        description: 'Maximum Attack Success Rate (percent) before the pipeline fails'
        required: false
        default: '5.0'
      fail_on_categories:
        description: 'Comma-separated category/subcategory names that fail the pipeline on any success (e.g. PROMPT_INJECTION,JAILBREAK). STATIC scans only.'
        required: false
        default: ''
      max_wait_minutes:
        description: 'How long to wait for the scan to finish before timing out'
        required: false
        default: '60'

  # To enable scheduled scans, set vars.RED_TEAM_TARGET_UUID first.
  # schedule:
  #   - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: red-team-target-${{ inputs.target_uuid || vars.RED_TEAM_TARGET_UUID || 'unconfigured' }}
  cancel-in-progress: false

jobs:
  red_teaming_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Prisma AIRS Red Teaming Scan
        id: scan
        env:
          PRISMA_AIRS_CLIENT_ID: ${{ vars.PRISMA_AIRS_CLIENT_ID }}
          PRISMA_AIRS_CLIENT_SECRET: ${{ secrets.PRISMA_AIRS_CLIENT_SECRET }}
          PRISMA_AIRS_TSG_ID: ${{ vars.PRISMA_AIRS_TSG_ID }}
          PRISMA_AIRS_TOKEN_ENDPOINT: ${{ vars.PRISMA_AIRS_TOKEN_ENDPOINT || 'https://auth.apps.paloaltonetworks.com/oauth2/access_token' }}
          PRISMA_AIRS_RED_TEAM_DATA_ENDPOINT: ${{ vars.PRISMA_AIRS_RED_TEAM_DATA_ENDPOINT || 'https://api.sase.paloaltonetworks.com/ai-red-teaming/data-plane' }}
          PRISMA_AIRS_RED_TEAM_MGMT_ENDPOINT: ${{ vars.PRISMA_AIRS_RED_TEAM_MGMT_ENDPOINT || 'https://api.sase.paloaltonetworks.com/ai-red-teaming/mgmt-plane' }}
          TARGET_UUID: ${{ inputs.target_uuid || vars.RED_TEAM_TARGET_UUID }}
          SCAN_TYPE: ${{ inputs.scan_type || 'STATIC' }}
          SCAN_CATEGORIES: ${{ inputs.categories }}
          MAX_ASR_PERCENT: ${{ inputs.max_asr_percent || '5.0' }}
          FAIL_ON_CATEGORIES: ${{ inputs.fail_on_categories }}
          MAX_WAIT_MINUTES: ${{ inputs.max_wait_minutes || '60' }}
        run: |
          if [[ ! "$MAX_WAIT_MINUTES" =~ ^([1-9]|[1-6][0-9]|7[0-5])$ ]]; then
            echo "Max wait must be between 1 and 75 minutes for this 90-minute job."
            exit 2
          fi
          python redteam_scan.py \
            --target-uuid "$TARGET_UUID" \
            --scan-type "$SCAN_TYPE" \
            --categories "$SCAN_CATEGORIES" \
            --max-asr-percent "$MAX_ASR_PERCENT" \
            --fail-on-categories "$FAIL_ON_CATEGORIES" \
            --max-wait-minutes "$MAX_WAIT_MINUTES"
      - name: Upload Scan Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: red-team-scan-report
          path: |
            red_team_report.json
            red_team_result.json
          retention-days: 14
      - name: Summarize scan
        if: always()
        run: python ci_report.py summary
